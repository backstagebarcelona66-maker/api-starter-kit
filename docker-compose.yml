version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: api_postgres
    environment:
      POSTGRES_DB: api_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: api_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 专业版 API 服务
  api-professional:
    build:
      context: ./api-professional
      dockerfile: Dockerfile
    container_name: api_professional
    ports:
      - "5006:5006"
    environment:
      - DATABASE_URL=postgresql://postgres:your_secure_password_here@postgres:5432/api_service
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=AIzaSyAcR7gXsIDENrgnXSyoA-SXidpqo8nBz-M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 视频生成 API 服务
  video-api:
    build:
      context: ./video-generation-api
      dockerfile: Dockerfile
    container_name: video_api
    ports:
      - "5007:5007"
    environment:
      - GEMINI_API_KEY=AIzaSyAcR7gXsIDENrgnXSyoA-SXidpqo8nBz-M
      - INFERENCE_API_KEY=${INFERENCE_API_KEY}
    restart: unless-stopped

  # 优化版 API 服务
  api-optimized:
    build:
      context: ./api-optimized
      dockerfile: Dockerfile
    container_name: api_optimized
    ports:
      - "5005:5005"
    environment:
      - GEMINI_API_KEY=AIzaSyAcR7gXsIDENrgnXSyoA-SXidpqo8nBz-M
    restart: unless-stopped

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: api_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api-professional
      - video-api
      - api-optimized
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
